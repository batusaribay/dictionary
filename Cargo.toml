[package]
name = "dictionary"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An offline dictionary in the terminal"
license = "MIT"
repository = "https://github.com/batusaribay/dictionary"
homepage = "https://github.com/batusaribay/dictionary"
readme = "README.md"
keywords = ["dictionary", "cli", "offline", "wordnet"]
categories = ["command-line-utilities"]

[[bin]]
name = "dictionary"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textwrap = "0.16"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
